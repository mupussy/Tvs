name: Build Playlist

on:
  workflow_dispatch:
  push:
    paths:
      - 'config.txt'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build playlist
        run: |
          USERNAME=$(grep USERNAME config.txt | cut -d= -f2)
          PASSWORD=$(grep PASSWORD config.txt | cut -d= -f2)

          sed "s/{{USERNAME}}/$USERNAME/g; s/{{PASSWORD}}/$PASSWORD/g" \
          list1.m3u > list2.m3u

          mv list2.m3u list1.m3u

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Update playlist
