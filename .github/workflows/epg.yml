
name: Automatic EPG Generator

on:
  workflow_dispatch:

  schedule:
    - cron: "0 3 */2 * *"

  push:
    paths:
      - "list1.m3u8"
      - "generate_epg.py"
      - ".github/workflows/epg.yml"

permissions:
  contents: write

concurrency:
  group: automatic-epg
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Generate EPG
        run: python -u generate_epg.py

      - name: Validate generated XML
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          path = "epg1.xml"
          assert os.path.exists(path), "epg1.xml was not generated"

          root = ET.parse(path).getroot()

          assert root.tag == "tv", "Invalid XMLTV root"
          channels = root.findall("channel")
          programmes = root.findall("programme")

          titled = [
              p for p in programmes
              if (p.findtext("title") or "").strip()
          ]

          assert channels, "No channels in EPG"
          assert titled, "No programmes with titles"

          channel_ids = {c.get("id") for c in channels}
          programme_ids = {p.get("channel") for p in programmes}

          unmatched = programme_ids - channel_ids
          assert not unmatched, f"Programme channel IDs missing: {unmatched}"

          print(f"XMLTV valid")
          print(f"Channels: {len(channels)}")
          print(f"Programmes: {len(programmes)}")
          print(f"Programmes with titles: {len(titled)}")

          size = os.path.getsize(path)
          print(f"EPG size: {size:,} bytes")

          assert size < 90 * 1024 * 1024, "EPG exceeds 90 MB"
          PY

      - name: Commit and push updated EPG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cp epg1.xml /tmp/epg1.xml

          git fetch origin main
          git reset --hard origin/main

          cp /tmp/epg1.xml epg1.xml

          git add epg1.xml

          if ! git diff --cached --quiet; then
            git commit -m "Automatically update EPG"
            git push origin HEAD:main
          else
            echo "EPG has no changes; skipping push."
          fi
