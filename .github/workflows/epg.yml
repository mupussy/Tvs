
name: Automatic EPG Generator

on:
  workflow_dispatch:

  schedule:
    - cron: "0 0,8,16 * * *"

  push:
    paths:
      - "list1.m3u8"
      - "generate_epg.py"
      - ".github/workflows/epg.yml"

permissions:
  contents: write

concurrency:
  group: automatic-epg
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Generate EPG
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python -u generate_epg.py

      - name: Validate generated XML
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          path = "epg.xml"

          assert os.path.exists(path), "epg.xml not found"

          root = ET.parse(path).getroot()

          assert root.tag == "tv", "Invalid XMLTV root"

          channels = root.findall("channel")
          programmes = root.findall("programme")

          titled = [
              p for p in programmes
              if (p.findtext("title") or "").strip()
          ]

          assert channels, "No channels found"
          assert titled, "No titled programmes found"

          channel_ids = {
              c.get("id") for c in channels
          }

          programme_ids = {
              p.get("channel") for p in programmes
          }

          assert programme_ids <= channel_ids, (
              "Programme references a missing channel"
          )

          size = os.path.getsize(path)

          assert size < 90 * 1024 * 1024, (
              "EPG exceeds 90 MiB"
          )

          print(
              f"Valid XMLTV: {len(channels)} channels, "
              f"{len(programmes)} programmes, "
              f"{size:,} bytes"
          )
          PY

      - name: Commit and push updated EPG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cp epg.xml /tmp/epg.xml

          if [ -f football_fixtures_cache.json ]; then
            cp football_fixtures_cache.json /tmp/football_fixtures_cache.json
            HAS_CACHE=1
          else
            HAS_CACHE=0
          fi

          git fetch origin main
          git reset --hard origin/main

          cp /tmp/epg.xml epg.xml

          if [ "$HAS_CACHE" = "1" ]; then
            cp /tmp/football_fixtures_cache.json football_fixtures_cache.json
          fi

          git add epg.xml football_fixtures_cache.json

          if ! git diff --cached --quiet; then
            git commit -m "Automatically update EPG"
            git push origin HEAD:main
          else
            echo "No EPG or cache changes to publish."
          fi
